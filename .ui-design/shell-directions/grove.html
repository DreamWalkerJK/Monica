  <script>
    const icon=(name,cls='')=>`<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const pages=[{id:'overview',name:'Overview',icon:'grid'},{id:'ai',name:'AI workspace',icon:'spark'},{id:'knowledge',name:'Knowledge',icon:'book'},{id:'modules',name:'Modules',icon:'cube',count:24},{id:'configuration',name:'Configuration',icon:'sliders'},{id:'observability',name:'Observability',icon:'pulse'},{id:'jobs',name:'Jobs',icon:'clock',count:12}];
    const modules=[{name:'AI',package:'Monica.AI',category:'Intelligence',provider:'OpenAI',state:'Healthy',dependencies:['Core','Configuration','Logging'],description:'One place for model providers, conversations, and streaming completions. Provider capabilities are available to every registered AI workspace.'},{name:'Knowledge',package:'Monica.AI.RAG',category:'Intelligence',provider:'Qdrant',state:'Healthy',dependencies:['AI','Repository','FileStorage'],description:'A shared retrieval layer for documents and knowledge collections. Local ingestion pipelines keep chunks, embeddings, and indexes in sync.'},{name:'Configuration',package:'Monica.Configuration',category:'Core',provider:'EF Core',state:'Healthy',dependencies:['Core','Repository'],description:'Typed, validated configuration with managed persistence. Changes can be inspected, reviewed, and applied at runtime.'},{name:'EventBus',package:'Monica.EventBus',category:'Messaging',provider:'RabbitMQ',state:'Healthy',dependencies:['Core','Logging','Outbox'],description:'Reliable application messaging through published events, subscriptions, and durable delivery policies.'},{name:'JobScheduler',package:'Monica.JobScheduler',category:'Core',provider:'PostgreSQL',state:'Healthy',dependencies:['Core','Repository','Logging'],description:'Recurring and triggered work with persistent execution history, scoped dependencies, and clear operational visibility.'},{name:'Observability',package:'Monica.Logging',category:'Operations',provider:'OpenTelemetry',state:'Healthy',dependencies:['Core'],description:'Correlated logs, traces, and metrics across framework modules. Follow execution from a request to its downstream dependencies.'},{name:'Repository',package:'Monica.Repository',category:'Core',provider:'EF Core',state:'Healthy',dependencies:['Core','UnitOfWork'],description:'Shared persistence contracts that keep transaction ownership and domain behavior clear.'},{name:'FileStorage',package:'Monica.FileStorage',category:'Core',provider:'S3 compatible',state:'Review',dependencies:['Core','Configuration'],description:'A consistent storage boundary for local and object-backed files. One provider endpoint has an upcoming credential rotation.'}];
    const params=new URLSearchParams(location.search);let state={layout:['side','top'].includes(params.get('layout'))?params.get('layout'):'side',theme:['light','dark'].includes(params.get('theme'))?params.get('theme'):'light',page:'overview',filter:'All',query:'',period:'24h'};let shellNavigation;
    const root=document.documentElement,main=document.getElementById('main-content'),dialog=document.getElementById('detail-dialog'),searchDialog=document.getElementById('search-dialog');let toastTimer;
    function applyShell(){root.dataset.layout=state.layout;root.dataset.theme=state.theme}
    const footer=()=>`<footer class="page-footer"><span class="footer-mark">${icon('logo')}Monica · Built to bring things together.</span><span>Grove / Design B · Sample data</span></footer>`;
    const title=(heading,description,actions='')=>`<div class="page-title"><div><div class="eyebrow">MONICA WORKSPACE / PRODUCTION</div><h1>${heading}</h1><p>${description}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`;
    function overview(){return `${title('Workspace overview','A clear view of everything keeping your workspace moving.',`<button class="btn date-button" id="date-range">${icon('calendar')}Last 24 hours</button><button class="btn btn-primary" data-page="modules"><span class="btn-label">Explore modules</span>${icon('arrow')}</button>`)}
      <section class="metric-strip" aria-label="Workspace metrics"><div class="metric"><div class="metric-title">${icon('cube')}Registered modules</div><div class="metric-value mono">24</div><div class="metric-foot"><span class="positive">24 active</span> · all initialized</div></div><div class="metric"><div class="metric-title">${icon('branch')}Connected providers</div><div class="metric-value mono">8</div><div class="metric-foot"><span class="positive">Across 6 services</span></div></div><div class="metric"><div class="metric-title">${icon('clock')}Jobs completed</div><div class="metric-value mono">1,284</div><div class="metric-foot"><span class="positive">↑ 12.8%</span> from yesterday</div></div><div class="metric"><div class="metric-title">${icon('pulse')}Trace success rate</div><div class="metric-value mono">99.98<span class="unit">%</span></div><div class="metric-foot"><span class="positive">Healthy</span> · 28.6k traces</div></div></section>
      <div class="dashboard-grid"><section class="panel"><div class="panel-heading"><div><h2>Workspace pulse</h2><p class="panel-subtitle">Steady traffic. Plenty of headroom.</p></div><select class="period-select" id="pulse-period" aria-label="Chart time range"><option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option></select></div><div class="chart-stats"><div class="chart-stat"><b class="mono" id="request-count">28,640</b><span class="trend">↗ 8.2%</span><small>total requests</small></div><div class="chart-stat"><b class="mono">42<span style="font-size:13px"> ms</span></b><small>median response</small></div><div class="chart-stat"><b class="mono">0.02<span style="font-size:13px">%</span></b><small>error rate</small></div></div><div class="chart"><svg viewBox="0 0 540 120" preserveAspectRatio="none" role="img" aria-label="Requests remain steady over the last 24 hours, rising slightly in the afternoon"><path class="gridline" d="M0 15H540M0 52H540M0 89H540"/><path class="area" d="M0 85 12 79 23 83 34 73 45 77 57 72 68 79 79 68 91 75 102 61 114 70 125 58 136 68 148 65 159 75 170 60 182 64 193 44 205 54 216 47 227 58 239 40 250 47 262 43 273 57 284 47 295 52 307 32 318 43 330 34 341 46 352 39 364 42 375 22 386 32 398 29 409 39 420 25 432 35 443 21 455 28 466 18 477 26 489 20 500 32 512 25 523 33 540 24V120H0Z"/><path class="line" d="M0 85 12 79 23 83 34 73 45 77 57 72 68 79 79 68 91 75 102 61 114 70 125 58 136 68 148 65 159 75 170 60 182 64 193 44 205 54 216 47 227 58 239 40 250 47 262 43 273 57 284 47 295 52 307 32 318 43 330 34 341 46 352 39 364 42 375 22 386 32 398 29 409 39 420 25 432 35 443 21 455 28 466 18 477 26 489 20 500 32 512 25 523 33 540 24"/></svg></div><div class="chart-footer" id="chart-axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>Now</span></div><div class="panel-bottom"><span style="display:flex;gap:6px;align-items:center"><span class="dot" style="color:var(--success)"></span>All services within threshold</span><button class="inline-link" data-page="observability">Open observability ${icon('arrow')}</button></div></section>
      <section class="panel foundation"><div class="foundation-title"><div class="eyebrow">YOUR FOUNDATION</div><h2>Individual modules.<br>One connected whole.</h2><p>A considered set of building blocks, working quietly together.</p></div><svg class="map" viewBox="0 0 310 136" role="img" aria-label="Monica Core connects AI, data, events, and jobs"><path class="wire" d="M65 32H128Q155 32 155 57M245 32H182Q155 32 155 57M65 105H128Q155 105 155 80M245 105H182Q155 105 155 80"/><rect class="node" x="16" y="15" width="87" height="34" rx="6"/><rect class="node" x="207" y="15" width="87" height="34" rx="6"/><rect class="node" x="16" y="88" width="87" height="34" rx="6"/><rect class="node" x="207" y="88" width="87" height="34" rx="6"/><rect class="center" x="115" y="51" width="80" height="34" rx="6"/><text x="60" y="35">AI + Knowledge</text><text x="250" y="35">Persistence</text><text x="60" y="108">Messaging</text><text x="250" y="108">Background jobs</text><text class="center-label" x="155" y="72">Monica Core</text><circle cx="155" cy="39" r="2.5" fill="#c7d8b8"/><circle cx="155" cy="97" r="2.5" fill="#c7d8b8"/></svg><div class="foundation-bottom"><span>24 modules · 8 providers</span><button class="inline-link" data-page="modules">Explore the registry ${icon('arrow')}</button></div></section></div>
      <div class="lower-grid"><section class="panel"><div class="panel-heading"><h2>Recently in your workspace</h2><button class="inline-link" data-page="observability">View all ${icon('arrow')}</button></div><div class="activity-list"><button class="activity-row" data-activity="knowledge"><span class="activity-icon">${icon('book')}</span><span><span class="activity-title">Knowledge index is up to date</span><span class="activity-desc" style="display:block">Engineering handbook · 128 documents processed</span></span><span class="activity-time">2 min ago</span></button><button class="activity-row" data-activity="job"><span class="activity-icon">${icon('check')}</span><span><span class="activity-title">Scheduled sync completed</span><span class="activity-desc" style="display:block">Workspace metadata · finished in 3.2 seconds</span></span><span class="activity-time">14 min ago</span></button><button class="activity-row" data-activity="config"><span class="activity-icon">${icon('sliders')}</span><span><span class="activity-title">Configuration published</span><span class="activity-desc" style="display:block">AI provider defaults · updated by Alex Lin</span></span><span class="activity-time">36 min ago</span></button></div></section><section class="panel"><div class="panel-heading"><h2>Your essential modules</h2><span class="badge">All healthy</span></div><div class="module-list">${[modules[0],modules[3],modules[4]].map(m=>`<button class="module-mini" data-module="${m.name}">${icon(m.name==='AI'?'spark':m.name==='EventBus'?'branch':'clock')}<span><span class="mini-name">${m.name}</span><small>${m.provider} provider</small></span><span class="dot"></span></button>`).join('')}</div></section></div>${footer()}`}
    function moduleRows(){const matches=modules.filter(m=>(state.filter==='All'||m.category===state.filter)&&`${m.name} ${m.package} ${m.provider}`.toLowerCase().includes(state.query.toLowerCase()));return matches.length?matches.map(m=>`<tr><td><button class="table-name" data-module="${m.name}"><span class="table-icon">${icon(m.name==='AI'?'spark':m.name==='Knowledge'?'book':'cube')}</span><span>${m.name}<small>${m.package}</small></span></button></td><td class="muted">${m.category}</td><td>${m.provider}</td><td><span class="badge ${m.state==='Review'?'warning':''}"><span class="dot"></span>${m.state}</span></td><td><button class="icon-button" data-module="${m.name}" aria-label="Inspect ${m.name}">${icon('arrow')}</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No modules match your search. Try another name or category.</td></tr>'}
    function registry(){return `${title('The module registry','Your infrastructure, thoughtfully composed. Inspect capabilities and their connections.',`<button class="btn" id="registry-info">${icon('book')}<span class="btn-label">Registry guide</span></button>`)}<section class="metric-strip"><div class="metric"><div class="metric-title">Registered modules</div><div class="metric-value">24</div><div class="metric-foot">Framework + application</div></div><div class="metric"><div class="metric-title">Active providers</div><div class="metric-value">8</div><div class="metric-foot">Ready to serve</div></div><div class="metric"><div class="metric-title">Capability groups</div><div class="metric-value">6</div><div class="metric-foot">Clear ownership</div></div><div class="metric"><div class="metric-title">Startup time</div><div class="metric-value">1.4<span class="unit">s</span></div><div class="metric-foot">All dependencies resolved</div></div></section><div class="registry-tools"><div class="filter-tabs" aria-label="Module category">${['All','Core','Intelligence','Messaging','Operations'].map(f=>`<button class="filter-tab" data-filter="${f}" aria-pressed="${state.filter===f}">${f}</button>`).join('')}</div><label class="input-wrap">${icon('search')}<input id="module-search" type="search" placeholder="Find a module or provider…" aria-label="Filter modules" autocomplete="off"></label></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Module</th><th>Category</th><th>Provider</th><th>Status</th><th aria-label="Actions"></th></tr></thead><tbody id="module-rows">${moduleRows()}</tbody></table></div><div class="table-meta"><span id="module-count">8 of 24 modules shown in this prototype</span><span>Registry snapshot · 09:42</span></div></section><p class="context-note">Select any module to inspect its purpose, provider, and dependencies.</p>${footer()}`}
    const context={ai:{title:'A workspace for intelligence',description:'The models, providers, and conversations behind your next idea.',cards:[['spark','Chat playground','Explore model behavior with reusable system prompts and tools.','3 active conversations'],['branch','Provider connections','OpenAI, Azure OpenAI, and local inference in one workspace.','3 providers connected'],['sliders','Model defaults','A shared set of thoughtful defaults for every application.','gpt-4.1 · streaming enabled']]},knowledge:{title:'Knowledge, within reach',description:'Reliable context for every conversation and every agent.',cards:[['book','Engineering handbook','128 documents · Architecture, conventions, and deployment guidance.','Indexed · 2 minutes ago'],['code','API reference','64 documents · Public contracts and infrastructure examples.','Indexed · 1 hour ago'],['cube','Product knowledge','42 documents · Domain language, workflows, and decision records.','Indexed · 3 hours ago']]},configuration:{title:'Everything, configured',description:'Typed settings with clear ownership and room to change.',cards:[['spark','AI provider defaults','Default model, completion limits, and request timeout settings.','Published · revision 18'],['clock','Job execution','Concurrency, retry policy, and execution history retention.','Published · revision 7'],['server','Storage providers','Database connections and object storage configuration.','Published · revision 12']]},observability:{title:'A clearer signal',description:'Follow your application through metrics, traces, and the details that matter.',cards:[['pulse','Request traces','28,640 requests in the last day. Median duration: 42 ms.','99.98% successful'],['server','Service health','All 8 providers are reachable. Database latency: 8 ms.','All services operational'],['code','Structured logs','Correlated events across requests, messages, and background jobs.','12 informative events']]},jobs:{title:'Good work, on schedule',description:'A quiet rhythm of background work across your workspace.',cards:[['clock','Workspace metadata sync','Every 15 minutes · Next execution at 10:00. Last run: 3.2 s.','Completed'],['book','Knowledge indexing','Every hour · Next execution at 10:00. Last run: 18.4 s.','Completed'],['server','Storage cleanup','Daily at 02:00 · 14 expired artifacts removed in the last run.','Completed']]}};
    function contextPage(){const c=context[state.page];return `${title(c.title,c.description,`<button class="btn" data-page="overview">${icon('grid')}<span class="btn-label">Overview</span></button>`)}<div class="context-grid">${c.cards.map((a,i)=>`<button class="panel context-card" data-context="${i}"><span class="context-icon">${icon(a[0])}</span><h2>${a[1]}</h2><p>${a[2]}</p><span class="badge"><span class="dot"></span>${a[3]}</span></button>`).join('')}</div><p class="context-note">A focused view of ${pages.find(p=>p.id===state.page).name.toLowerCase()}. Select an item to explore its details.</p>${footer()}`}
    function navigate(page){state.page=page;main.innerHTML=page==='overview'?overview():page==='modules'?registry():contextPage();if(page==='modules'){document.getElementById('module-search').value=state.query;updateRegistry()}document.querySelector('.workspace').scrollTop=0}
    function updateRegistry(){document.getElementById('module-rows').innerHTML=moduleRows();document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));const count=modules.filter(m=>(state.filter==='All'||m.category===state.filter)&&`${m.name} ${m.package} ${m.provider}`.toLowerCase().includes(state.query.toLowerCase())).length;document.getElementById('module-count').textContent=`${count} of 24 modules shown in this prototype`}
    function openDetail(heading,subtitle,body,eyebrow='WORKSPACE DETAILS'){document.getElementById('detail-title').textContent=heading;document.getElementById('detail-subtitle').textContent=subtitle;document.getElementById('detail-content').innerHTML=body;document.getElementById('detail-eyebrow').textContent=eyebrow;dialog.showModal()}
    function inspectModule(name){const m=modules.find(m=>m.name===name);openDetail(m.name,m.package,`<p>${m.description}</p><dl class="detail-list"><div><dt>Status</dt><dd><span class="badge ${m.state==='Review'?'warning':''}"><span class="dot"></span>${m.state}</span></dd></div><div><dt>Provider</dt><dd>${m.provider}</dd></div><div><dt>Category</dt><dd>${m.category}</dd></div><div><dt>Lifetime</dt><dd>Host managed</dd></div></dl><div class="detail-block"><h3>Module dependencies</h3>${m.dependencies.map(d=>`<span class="detail-tag">${d}</span>`).join('')}</div>${m.state==='Review'?'<div class="detail-block"><h3>Credential rotation</h3><p>The sample storage credential expires in 14 days. Review the provider configuration before rotation.</p></div>':''}`,'MODULE DETAILS')}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
    function renderSearch(){
      const q=document.getElementById('global-search').value.toLowerCase().trim();
      const registeredPages=window.shellNavigation?.getPages()||pages.map(p=>({id:p.id,base:p.id,label:p.name,categoryLabel:'Workspace',groupLabel:'Pages'}));
      const entries=[...registeredPages.map(p=>({name:p.label,icon:pages.find(item=>item.id===p.base)?.icon||'grid',page:p.id,type:'Page',context:`${p.categoryLabel} / ${p.groupLabel}`,description:p.description||''})),...modules.map(m=>({name:m.name,icon:'cube',module:m.name,type:'Module',context:m.package,description:m.description}))];
      const matches=entries.filter(r=>`${r.name} ${r.context} ${r.description}`.toLowerCase().includes(q));
      document.getElementById('search-results').innerHTML=matches.length?matches.map(r=>`<button class="search-result" ${r.page?`data-search-page="${r.page}"`:`data-search-module="${r.module}"`}>${icon(r.icon)}<span class="search-result-copy"><span>${r.name}</span><small>${r.context}</small></span><span class="search-result-type">${r.type}${icon('arrow')}</span></button>`).join(''):'<p class="empty">No matches found. Try “Providers”, “Traces”, or “Jobs”.</p>';
    }
    function openSearch(){document.getElementById('global-search').value='';renderSearch();searchDialog.showModal();document.getElementById('global-search').focus()}
    document.getElementById('search-button').innerHTML=icon('search');document.getElementById('search-button').onclick=openSearch;document.querySelectorAll('.close-dialog.icon-button,.close-search').forEach(b=>b.innerHTML=icon('close'));document.querySelectorAll('.close-dialog').forEach(b=>b.onclick=()=>dialog.close());document.querySelector('.close-search').onclick=()=>searchDialog.close();document.getElementById('global-search').oninput=renderSearch;
    document.getElementById('profile-button').onclick=()=>openDetail('Alex Lin','Workspace owner','<p>You have full access to this sample workspace, including configuration, module diagnostics, and operational tools.</p><div class="detail-block"><h3>Your display preferences</h3><p>Open Appearance settings to choose your navigation layout and color mode. Your selection is saved locally in this browser.</p></div>','YOUR PROFILE');
    function docs(){openDetail('A shared foundation','Monica framework documentation','<p>Modules make infrastructure capabilities available through a consistent composition model. Providers connect those capabilities to concrete services.</p><div class="detail-block"><h3>Start with the shell</h3><p>Choose side or top navigation in Appearance settings to match your workspace. Pages keep their context when the layout changes, and both color modes use the same semantic roles.</p></div><div class="detail-block"><h3>Explore a module</h3><p>Open the registry, filter by capability, and select a module to inspect its provider and dependencies.</p></div>','DOCUMENTATION PREVIEW')};
    document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){goPage(page.dataset.page);return}const module=e.target.closest('[data-module]');if(module){inspectModule(module.dataset.module);return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;updateRegistry();return}const searchPage=e.target.closest('[data-search-page]');if(searchPage){searchDialog.close();shellNavigation.navigate(searchPage.dataset.searchPage);return}const searchModule=e.target.closest('[data-search-module]');if(searchModule){searchDialog.close();inspectModule(searchModule.dataset.searchModule);return}const contextButton=e.target.closest('[data-context]');if(contextButton){const c=context[state.page].cards[Number(contextButton.dataset.context)];openDetail(c[1],pages.find(p=>p.id===state.page).name,`<p>${c[2]}</p><dl class="detail-list"><div><dt>Current state</dt><dd>${c[3]}</dd></div><div><dt>Environment</dt><dd>Production</dd></div><div><dt>Owner</dt><dd>Monica.AppHost</dd></div><div><dt>Last checked</dt><dd>Just now</dd></div></dl><div class="detail-block"><h3>Workspace connection</h3><p>This capability is composed through the module registry. Its provider and dependencies can be inspected on the Modules page.</p></div>`);return}const activity=e.target.closest('[data-activity]');if(activity){const items={knowledge:['Knowledge index refreshed','Engineering handbook','128 documents were processed successfully. The retrieval index now includes the latest architecture and deployment guidance.'],job:['Scheduled sync completed','Workspace metadata','The scheduled metadata sync finished in 3.2 seconds. All 24 module records are current; no retries were required.'],config:['Configuration published','AI provider defaults','Alex Lin published revision 18. The default model and request timeout passed validation and were applied to the running host.']};const a=items[activity.dataset.activity];openDetail(a[0],a[1],`<p>${a[2]}</p><dl class="detail-list"><div><dt>Outcome</dt><dd>Successful</dd></div><div><dt>Environment</dt><dd>Production</dd></div></dl>`,'WORKSPACE ACTIVITY');return}if(e.target.closest('#registry-info'))docs();if(e.target.closest('#date-range')){const period=document.getElementById('pulse-period');period.focus();period.value=period.value==='24h'?'7d':'24h';period.dispatchEvent(new Event('change',{bubbles:true}))}});
    document.addEventListener('input',e=>{if(e.target.id==='module-search'){state.query=e.target.value;updateRegistry()}});document.addEventListener('change',e=>{if(e.target.id==='pulse-period'){state.period=e.target.value;document.getElementById('request-count').textContent=state.period==='24h'?'28,640':'198,420';document.getElementById('chart-axis').innerHTML=(state.period==='24h'?['00:00','06:00','12:00','18:00','Now']:['Thu','Fri','Sat','Sun','Mon','Tue','Today']).map(t=>`<span>${t}</span>`).join('');const date=document.getElementById('date-range');if(date)date.innerHTML=icon('calendar')+(state.period==='24h'?'Last 24 hours':'Last 7 days');toast(state.period==='24h'?'Showing the last 24 hours of sample traffic':'Showing the last 7 days of sample traffic')}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog.open&&!searchDialog.open)openSearch()}});[dialog,searchDialog].forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));applyShell();navigate('overview');
    function goPage(base){if(shellNavigation?.navigateBase)shellNavigation.navigateBase(base);else navigate(base)}
  </script>
  <script src="shell-navigation.js?revision=single-row-v3"></script>
  <script>
    shellNavigation=window.MonicaShellNavigation.mount({
      id:'grove',theme:state.theme,layout:state.layout,
      onNavigate(leaf){
        navigate(leaf.base);
        if(leaf.id!=='workspace-overview'){
          const heading=main.querySelector('h1');
          if(heading)heading.textContent=leaf.label||heading.textContent;
          if(leaf.description){const description=main.querySelector('.page-title p');if(description)description.textContent=leaf.description;}
        }
      },
      onAppearance({layout,theme}){state.layout=layout;state.theme=theme;applyShell();}
    });
    window.shellNavigation=shellNavigation;
  </script>
