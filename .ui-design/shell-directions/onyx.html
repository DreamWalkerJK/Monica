<script>
const paths={overview:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',ai:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',knowledge:'<path d="M3 5c4-2 6-1 9 1 3-2 5-3 9-1v14c-4-2-6-1-9 1-3-2-5-3-9-1V5ZM12 6v14"/>',modules:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9"/>',configuration:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="var(--surface)"/><circle cx="16" cy="17" r="3" fill="var(--surface)"/>',observability:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',jobs:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',refresh:'<path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5M4 14a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/>',check:'<path d="m5 12 4 4L19 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/>',moon:'<path d="M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/>',external:'<path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6"/>'};

const routes=[['overview','Overview','overview'],['ai','AI workspace','ai'],['knowledge','Knowledge','knowledge'],['modules','Modules','modules'],['configuration','Configuration','configuration'],['observability','Observability','observability'],['jobs','Jobs','jobs']];
const moduleData=[['AI','Intelligence','OpenAI · Azure AI','8 providers','Ready'],['Knowledge','Intelligence','Document & vector storage','2 providers','Ready'],['Module system','Foundation','Module registration & lifecycle','Core','Ready'],['Dependency injection','Foundation','Conventional registration','Core','Ready'],['Configuration','Foundation','Runtime options & validation','2 providers','Ready'],['Logging','Observability','Structured application logs','Serilog','Ready'],['OpenTelemetry','Observability','Traces, metrics & exporters','OTLP','Ready'],['Health checks','Observability','Readiness & liveness probes','Core','Ready'],['Repository','Persistence','Aggregate persistence','EF Core','Ready'],['Unit of work','Persistence','Transactional boundaries','EF Core','Ready'],['Event bus','Messaging','Publish & subscribe','Redis','Ready'],['Outbox','Messaging','Durable event delivery','EF Core','Ready'],['Inbox','Messaging','Idempotent event handling','EF Core','Ready'],['RPC','Messaging','Typed service communication','HTTP','Ready'],['Data channel','Messaging','Ordered processing pipelines','Core','Ready'],['SignalR','Messaging','Real-time communication','Redis','Ready'],['Jobs','Foundation','Recurring & triggered work','2 providers','Ready'],['Caching','Persistence','Distributed & local cache','Redis','Ready'],['State store','Persistence','Versioned application state','Redis','Ready'],['Service discovery','Foundation','Endpoint discovery','Consul','Ready'],['Authentication','Web','Identity & access','JWT','Ready'],['Web API','Web','Generated HTTP controllers','ASP.NET','Ready'],['UI shell','Web','Navigation, themes & layout','Blazor','Ready'],['Markdown','Web','Rich document rendering','Core','Ready']];
const $=s=>document.querySelector(s);let route='overview',filter='all',moduleQuery='',period='24h',toastTimer,shellNavigation,selectedLeaf;
let prefs={layout:'side',theme:'dark'};const params=new URLSearchParams(location.search);if(['side','top'].includes(params.get('layout')))prefs.layout=params.get('layout');if(['dark','light'].includes(params.get('theme')))prefs.theme=params.get('theme');
function applyPreferences(){document.documentElement.dataset.layout=prefs.layout;document.documentElement.dataset.theme=prefs.theme;}applyPreferences();
function navigate(id,fromShell=false){if(shellNavigation&&!fromShell){shellNavigation.navigateBase(id);return;}route=routes.some(r=>r[0]===id)?id:'overview';render();document.querySelector('.workarea').scrollTop=0;}
function applyLeafHeading(){if(selectedLeaf&&selectedLeaf.id!=='workspace-overview'){const title=$('#main h1'),description=$('#main .heading p');if(title)title.textContent=selectedLeaf.label||selectedLeaf.name||selectedLeaf.title;if(description&&selectedLeaf.description)description.textContent=selectedLeaf.description;}}
const foot=()=>`<footer class="footer"><span>MONICA / MODULAR INFRASTRUCTURE</span><span><span>production · eu-west-1</span><span>Sample workspace</span></span></footer>`;
function header(title,subtitle,label='WORKSPACE / 01'){return `<div class="heading"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-meta"><div class="live"><span class="dot"></span>Systems operational</div><p>LAST SYNC <span id="lastSync">JUST NOW</span></p></div></div>`}
function diagram(){return `<div class="system-map" role="img" aria-label="Monica connects intelligence, data, messaging, and runtime modules"><svg viewBox="0 0 390 205"><path class="diagram-rule" d="M107 56h72v47M282 56h-68v47M107 153h72v-50M282 153h-68v-50M48 56h22M320 56h23M48 153h22M320 153h23"/><rect class="diagram-box" x="69" y="36" width="77" height="41" rx="3"/><rect class="diagram-box" x="244" y="36" width="77" height="41" rx="3"/><rect class="diagram-box" x="69" y="133" width="77" height="41" rx="3"/><rect class="diagram-box" x="244" y="133" width="77" height="41" rx="3"/><rect class="diagram-center" x="167" y="76" width="60" height="56" rx="6"/><text class="diagram-mark" x="187" y="112">M</text><text class="diagram-label" x="85" y="61">AI / 08</text><text class="diagram-label" x="256" y="61">DATA / 04</text><text class="diagram-label" x="81" y="159">EVENT / 06</text><text class="diagram-label" x="256" y="159">CORE / 06</text><circle cx="48" cy="56" r="2" fill="var(--accent)"/><circle cx="343" cy="56" r="2" fill="var(--accent)"/><circle cx="48" cy="153" r="2" fill="var(--accent)"/><circle cx="343" cy="153" r="2" fill="var(--accent)"/></svg><span class="map-caption">CONNECTED BY DESIGN</span></div>`}
function overview(){return header('Workspace overview','Everything connected. Everything in its place.')+`<section class="hero"><div class="hero-content"><div class="hero-label">${icon('check')}YOUR FOUNDATION IS READY</div><h2>Built to work together.</h2><p>24 modules. One coherent workspace.<br>Your infrastructure is healthy and ready for what comes next.</p><button class="text-link" data-route="modules">Explore your modules ${icon('arrow')}</button></div>${diagram()}</section><section class="metrics" aria-label="Workspace metrics">${[['Active modules','24','','All modules healthy','modules'],['AI providers','08','','<span class="accent">3</span> models in use','ai'],['Requests today','142.8','k','<span class="accent">↗ 12.6%</span> vs. yesterday','observability'],['Average latency','42','ms','p95 <span class="accent">86 ms</span>','jobs']].map(([title,num,unit,desc,i])=>`<div class="metric"><div class="metric-top">${title}${icon(i)}</div><div class="metric-number">${num}<small>${unit}</small></div><div class="metric-foot">${desc}</div></div>`).join('')}</section><div class="lower-grid"><section><div class="section-heading"><h2>Request activity</h2><div class="small-tabs" aria-label="Activity period">${['1h','24h','7d'].map(p=>`<button class="${period===p?'active':''}" data-period="${p}" aria-pressed="${period===p}">${p}</button>`).join('')}</div></div><div class="chart-meta"><span><strong id="chartTotal">${period==='1h'?'6,412':period==='7d'?'984,231':'142,819'}</strong> requests</span><span class="legend">Successful</span></div><div class="chart"><svg viewBox="0 0 550 127" preserveAspectRatio="none" role="img" aria-label="Request volume rises through the day with a peak in the afternoon"><path class="chart-grid" d="M0 20h550M0 60h550M0 100h550"/><path class="chart-fill" d="M0 100 15 101 30 95 44 99 57 88 70 90 84 76 98 82 112 73 126 80 140 62 155 68 168 50 182 57 196 48 210 59 224 40 238 45 252 31 266 45 280 28 294 36 308 52 322 42 336 59 350 50 365 66 378 47 392 56 406 45 420 54 434 34 448 45 462 28 476 33 490 22 504 29 520 19 535 26 550 17V127H0Z"/><path class="chart-line" d="M0 100 15 101 30 95 44 99 57 88 70 90 84 76 98 82 112 73 126 80 140 62 155 68 168 50 182 57 196 48 210 59 224 40 238 45 252 31 266 45 280 28 294 36 308 52 322 42 336 59 350 50 365 66 378 47 392 56 406 45 420 54 434 34 448 45 462 28 476 33 490 22 504 29 520 19 535 26 550 17"/></svg><div class="chart-labels">${(period==='1h'?['14:00','14:15','14:30','14:45','15:00']:period==='7d'?['THU','FRI','SAT','SUN','MON','TUE','WED']:['00:00','04:00','08:00','12:00','16:00','20:00','24:00']).map(x=>`<span>${x}</span>`).join('')}</div></div><div class="chart-footer"><span>28 retried requests</span><span>99.98% success rate</span></div></section><section><div class="section-heading"><h2>Latest activity</h2><button class="text-link" data-route="observability">View all ${icon('arrow')}</button></div>${[['jobs','Knowledge index updated','knowledge.reindex · 1.2 s','2m ago'],['configuration','Configuration synchronized','production · 12 options','8m ago'],['ai','AI provider connected','Azure OpenAI · eastus','24m ago']].map(([i,title,detail,time])=>`<div class="activity-row"><span class="activity-icon">${icon(i)}</span><div class="activity-copy"><strong>${title}</strong><small>${detail}</small></div><time>${time}</time></div>`).join('')}</section></div>`+foot()}
function modules(){return header('Your building blocks.','A clear view of every module powering your workspace.','WORKSPACE / MODULES')+`<div class="filterbar"><div class="filters" aria-label="Filter modules">${[['all','All modules','24'],['foundation','Foundation','5'],['intelligence','Intelligence','2'],['messaging','Messaging','6']].map(([id,label,count])=>`<button data-filter="${id}" class="${filter===id?'active':''}" aria-pressed="${filter===id}">${label} <span class="muted">${count}</span></button>`).join('')}</div><label class="filter-input">${icon('search')}<input id="moduleFilter" placeholder="Find a module…" aria-label="Filter modules" value="${moduleQuery.replaceAll('"','&quot;')}"></label></div><div class="table-wrap"><table><thead><tr><th>MODULE</th><th>CATEGORY</th><th>PROVIDER</th><th>STATUS</th><th></th></tr></thead><tbody id="moduleRows">${moduleRows()}</tbody></table></div><div class="footer"><span id="moduleCount">${filteredModules().length} of 24 modules</span><span>All dependencies resolved</span></div>`+foot()}
function filteredModules(){return moduleData.filter(m=>(filter==='all'||m[1].toLowerCase()===filter)&&m.join(' ').toLowerCase().includes(moduleQuery.toLowerCase()))}function moduleRows(){const rows=filteredModules();return rows.length?rows.map(m=>`<tr><td><div class="module-cell"><span class="module-symbol">${icon(m[1]==='Intelligence'?'ai':'modules')}</span><span><strong>${m[0]}</strong><small>${m[2]}</small></span></div></td><td class="muted">${m[1]}</td><td class="mono muted" style="font-size:10px">${m[3]}</td><td><span class="badge"><span class="dot"></span>${m[4]}</span></td><td><button class="table-button" data-module="${moduleData.indexOf(m)}" aria-label="View ${m[0]} details">Details ${icon('arrow')}</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No modules match your search.</td></tr>'}
const pages={ai:{title:'Intelligence, connected.',desc:'Manage the providers behind every conversation and workflow.',metrics:[['Providers','08','All connected'],['Models','12','3 models in use'],['Tokens today','284k','Within daily budget']],section:'Connected providers',columns:['PROVIDER','CAPABILITY','ENDPOINT','STATUS'],rows:[['OpenAI','Chat · Embeddings','api.openai.com','Connected'],['Azure OpenAI','Chat · Embeddings','eastus','Connected'],['Anthropic','Chat','api.anthropic.com','Connected'],['Ollama','Chat · Embeddings','Local network','Connected'],['DeepSeek','Chat','api.deepseek.com','Connected'],['Google Gemini','Chat · Vision','us-central1','Connected'],['Qwen','Chat · Embeddings','cn-hangzhou','Connected'],['Mistral','Chat · Embeddings','api.mistral.ai','Connected']]},knowledge:{title:'Knowledge with context.',desc:'The documents and collections that make your AI work smarter.',metrics:[['Collections','04','All indexed'],['Documents','1,248','32 added this week'],['Index health','100%','Updated 2 minutes ago']],section:'Knowledge collections',columns:['COLLECTION','DOCUMENTS','LAST INDEX','STATUS'],rows:[['Framework documentation','684 documents','2 minutes ago','Indexed'],['Architecture decisions','132 documents','1 hour ago','Indexed'],['Engineering handbook','276 documents','3 hours ago','Indexed'],['API reference','156 documents','Yesterday','Indexed']]},configuration:{title:'Every option, in order.',desc:'Inspect the configuration your modules are running with.',metrics:[['Option groups','12','Validated'],['Active values','84','Production'],['Pending changes','0','Everything synchronized']],section:'Configuration groups',columns:['GROUP','OPTIONS','SOURCE','STATUS'],rows:[['AI provider options','12 values','Environment','Valid'],['Job scheduler options','8 values','Managed configuration','Valid'],['Repository options','14 values','appsettings.json','Valid'],['UI theme options','16 values','Managed configuration','Valid'],['OpenTelemetry options','9 values','Environment','Valid']]},observability:{title:'Clarity at every layer.',desc:'Follow requests, trace dependencies, and keep your system in view.',metrics:[['Requests today','142.8k','12.6% above yesterday'],['p95 latency','86 ms','Within threshold'],['Availability','99.98%','Over the last 30 days']],section:'Recent traces',columns:['OPERATION','DURATION','SERVICE','STATUS'],rows:[['POST /api/ai/chat','142 ms','Monica.AI','Success'],['Knowledge.Reindex','1.2 s','Monica.Knowledge','Success'],['Configuration.Sync','18 ms','Monica.Configuration','Success'],['GET /api/modules','12 ms','Monica.Core','Success'],['Outbox.Dispatch','31 ms','Monica.EventBus','Success']]},jobs:{title:'Work that keeps moving.',desc:'Recurring tasks and background operations, running on schedule.',metrics:[['Scheduled jobs','16','12 recurring'],['Completed today','284','Zero failures'],['Running now','02','Across 2 workers']],section:'Scheduled jobs',columns:['JOB','SCHEDULE','LAST RUN','STATUS'],rows:[['Knowledge.Reindex','Every 30 minutes','2 minutes ago','Completed'],['Outbox.Dispatch','Every 10 seconds','8 seconds ago','Running'],['HealthProbe.Check','Every minute','34 seconds ago','Completed'],['Cache.Cleanup','Every 6 hours','2 hours ago','Completed'],['Telemetry.Export','Every 30 seconds','12 seconds ago','Running']]}};
function secondary(){const p=pages[route];return header(p.title,p.desc,`WORKSPACE / ${route.toUpperCase()}`)+`<section class="route-summary">${p.metrics.map(([a,b,c])=>`<div class="metric"><div class="metric-top">${a}</div><div class="metric-number">${b}</div><div class="metric-foot">${c}</div></div>`).join('')}</section><div class="section-heading"><h2>${p.section}</h2><button class="button" id="refreshData">${icon('refresh')}Refresh</button></div><div class="table-wrap"><table><thead><tr>${p.columns.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${p.rows.map((r,i)=>`<tr>${r.map((c,n)=>`<td class="${n===0?'':n===3?'badge':'muted'}">${n===3?'<span class="dot"></span>':''}${c}</td>`).join('')}<td><button class="table-button" data-record="${i}" aria-label="View ${r[0]}">Inspect ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`+foot()}
function render(){document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===route);if(b.dataset.route===route)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#main').innerHTML=route==='overview'?overview():route==='modules'?modules():secondary();if($('#moduleFilter'))$('#moduleFilter').addEventListener('input',e=>{moduleQuery=e.target.value;$('#moduleRows').innerHTML=moduleRows();$('#moduleCount').textContent=`${filteredModules().length} of 24 modules`});applyLeafHeading();document.title=`${selectedLeaf?.label||routes.find(r=>r[0]===route)[1]} — Onyx / Monica`}
function modal(title,body,footer='Close'){const d=$('#detailDialog');d.innerHTML=`<div class="dialog-head"><h2 id="detailTitle">${title}</h2><button class="icon-button" data-close="detailDialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-end"><button class="button" data-close="detailDialog">${footer}</button></div>`;d.showModal()}
function showModule(i){const m=moduleData[i];modal(m[0],`<div class="hero-label">${icon('check')}MODULE READY</div><p>${m[2]}. This module is registered and its dependencies have been resolved successfully.</p><div class="detail-grid"><div><span>CATEGORY</span><strong>${m[1]}</strong></div><div><span>PROVIDER</span><strong>${m[3]}</strong></div><div><span>LIFECYCLE</span><strong>Initialized</strong></div><div><span>HEALTH</span><strong>Operational</strong></div></div><div class="information" style="margin:0"><span>${icon('modules')}</span><div><h3>Part of your foundation</h3><p>Module services are available to the workspace through the Monica host.</p></div></div>`)}
function toast(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function search(){const query=$('#commandInput').value.toLowerCase();const matchPages=shellNavigation.getPages().filter(p=>[p.label,p.description,p.categoryLabel,p.groupLabel].join(' ').toLowerCase().includes(query));const matches=moduleData.map((m,i)=>[m,i]).filter(([m])=>m.join(' ').toLowerCase().includes(query));$('#searchResults').innerHTML=matchPages.map(p=>`<button class="search-result" data-search-leaf="${p.id}">${icon(p.base)}<span class="search-result-copy"><span>${p.label}</span><small>${[p.categoryLabel,p.groupLabel].filter(Boolean).join(' / ')}</small></span><small>Page</small></button>`).join('')+matches.slice(0,10).map(([m,i])=>`<button class="search-result" data-search-module="${i}">${icon('modules')}${m[0]}<small>Module</small></button>`).join('')||'<div class="empty">No matching pages or modules.</div>'}
function openSearch(){$('#searchDialog').showModal();$('#commandInput').value='';search();$('#commandInput').focus()}$('#globalSearch').onclick=openSearch;$('#commandInput').oninput=search;$('#notificationButton').onclick=()=>modal('Workspace activity',`<div class="activity-row"><span class="activity-icon">${icon('check')}</span><div class="activity-copy"><strong>All systems operational</strong><small>24 of 24 modules healthy</small></div></div><div class="activity-row"><span class="activity-icon">${icon('knowledge')}</span><div class="activity-copy"><strong>Knowledge index updated</strong><small>1,248 documents available · 2 minutes ago</small></div></div><p>You are up to date. No action is required.</p>`);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route)navigate(b.dataset.route);if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.period){period=b.dataset.period;render()}if(b.dataset.module!==undefined)showModule(Number(b.dataset.module));if(b.dataset.close)$('#'+b.dataset.close).close();if(b.dataset.searchLeaf){$('#searchDialog').close();shellNavigation.navigate(b.dataset.searchLeaf)}if(b.dataset.searchModule!==undefined){$('#searchDialog').close();showModule(Number(b.dataset.searchModule))}if(b.id==='refreshData'){const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#lastSync').textContent=t;toast('Workspace data refreshed. All systems operational.')}if(b.dataset.record!==undefined){const p=pages[route],r=p.rows[Number(b.dataset.record)];modal(r[0],`<div class="hero-label">${icon('check')}${r[3].toUpperCase()}</div><div class="detail-grid">${p.columns.map((c,i)=>`<div><span>${c}</span><strong>${r[i]}</strong></div>`).join('')}</div><p>Observed in the production workspace. This view contains sample operational data for the design prototype.</p>`)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#searchDialog').open)openSearch()}});document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));navigate('overview',true);
</script>
